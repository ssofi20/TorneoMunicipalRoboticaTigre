<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torneo de Robótica Municipal</title>
<style>
:root{--bg:#f4f4f4;--card:#fff;--tx:#111;--mu:#666;--rd:#d52b1e;--bd:#e2e2e2;--bl:#4aa3df}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
header .top{background:#fff;padding:10px 16px;border-bottom:3px solid var(--bl)}header .top img{width:auto;height:auto;max-height:56px;max-width:100%;display:block}.cred-logo{width:auto;height:auto;max-height:48px;max-width:100%;margin:0 auto 10px;display:block}
.band{background:var(--rd);color:#fff;padding:12px 16px}.band h1{margin:0;font-size:1.25rem}.band p{margin:2px 0 10px;font-size:.85rem}
#nav{display:flex;gap:6px;flex-wrap:wrap}#nav button{background:transparent;color:#fff;border:1px solid #ffffff99;padding:8px 12px;border-radius:8px;font-size:.95rem}#nav button.on{background:#fff;color:var(--rd);font-weight:700;border-color:#fff}
main{max-width:760px;margin:0 auto;padding:12px}
footer{text-align:center;color:var(--mu);font-size:.8rem;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
h2{margin:0 0 8px}h3{margin:14px 0 6px}
label{display:block;margin:10px 0;font-weight:600;font-size:.9rem}label.chk{font-weight:400;display:flex;gap:8px;align-items:center;font-size:1rem}
input,select{width:100%;padding:10px;margin-top:4px;border:1px solid #c9c9c9;border-radius:8px;font-size:1rem;background:#fff;color:var(--tx)}
input[type=checkbox]{width:auto;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
button{padding:10px 14px;border-radius:8px;border:1px solid #bbb;background:#fff;color:var(--tx);font-size:1rem;cursor:pointer;margin:2px 0}
button.pr{background:var(--rd);color:#fff;border-color:var(--rd)}button.ok{background:#111;color:#fff;border-color:#111}
fieldset{border:1px solid var(--bd);border-radius:8px;margin:10px 0}
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.mu,small{color:var(--mu)}.ctr{text-align:center}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:6px;text-align:left;border-bottom:1px solid var(--bd)}th{border-bottom:2px solid #111}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.mini{border:1px solid var(--bd);border-radius:8px;padding:8px}
.ln select{width:70px;margin:0}.sc{width:62px;text-align:center;margin:0}.vs{white-space:nowrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:9}#toast.show{opacity:1}#toast.bad{background:var(--rd)}
#reader{max-width:320px;margin:8px auto}
@media print{header,.noprint,#toast,footer{display:none}}
</style></head><body>

 const {data,error}=await sb.rpc('register',{p});

 const q=qrcode(0,'M');q.addData(data);q.make();

const rc=(c,e)=>({dragster:rcD,futbol:rcF,laberinto:rcL})[c](FX[c],e);
function rcL(d,e){const L=d.players.map((p,i)=>({...p,i,b:Math.min(...p.t.filter(x=>x!=null),Infinity)})).sort((a,b)=>a.b-b.b);
 return `<div class="scroll"><table><tr><th>#</th><th>Alumno</th><th>Club</th><th>Intento 1</th><th>Intento 2</th><th>Mejor</th></tr>${L.map((p,k)=>`<tr><td>${p.b<Infinity?k+1:'-'}</td><td>${esc(p.n)}</td><td>${esc(p.c)}</td>${[0,1].map(j=>`<td>${e?`<input class="sc" type="number" step="0.01" min="0" value="${p.t[j]??''}" onchange="setT(${p.i},${j},this.value)">`:(p.t[j]??'-')}</td>`).join('')}<td><b>${p.b<Infinity?p.b.toFixed(2)+' s':'-'}</b></td></tr>`).join('')}</table></div>`}
function rcD(d,e){const last=d.rounds.at(-1),w=last.name=='Final'&&last.heats[0].find(x=>x.p==1);
 return d.rounds.map((r,ri)=>`<h3>${r.name}</h3><div class="grid">${r.heats.map((h,hi)=>`<div class="mini"><b>Serie ${hi+1}</b>${h.map((x,xi)=>`<div class="ln"><span>${esc(x.n)} <small>${esc(x.c)}</small></span>${e?`<select onchange="setP(${ri},${hi},${xi},this.value)"><option value="">-</option>${h.map((_,n)=>`<option ${x.p==n+1?'selected':''}>${n+1}</option>`).join('')}</select>`:(x.p?x.p+'°':'')}</div>`).join('')}</div>`).join('')}</div>`).join('')+(w?`<h3>🏆 Campeón: ${esc(w.n)}</h3>`:'')}
const tbl=g=>{const t={};g.teams.forEach(x=>t[x.n]={n:x.n,c:x.c,pj:0,pts:0,gd:0,gf:0});
 g.matches.forEach(m=>{if(m.sa==null||m.sb==null)return;const a=t[m.a],b=t[m.b];a.pj++;b.pj++;a.gf+=m.sa;b.gf+=m.sb;a.gd+=m.sa-m.sb;b.gd+=m.sb-m.sa;if(m.sa>m.sb)a.pts+=3;else if(m.sa<m.sb)b.pts+=3;else{a.pts++;b.pts++}});
 return Object.values(t).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf)};
function rcF(d,e){const sc=(m,f,k)=>e?`<input class="sc" type="number" min="0" value="${m[k]??''}" onchange="${f},'${k}',this.value)">`:(m[k]??'-');
 const ml=(m,f)=>m.b==null?`<div class="ln"><span>${esc(m.a)}</span><small>pasa directo</small></div>`:`<div class="ln"><span>${esc(m.a)}</span><span class="vs">${sc(m,f,'sa')} - ${sc(m,f,'sb')}</span><span>${esc(m.b)}</span></div>`;
 const fin=d.ko.at(-1),m=fin?.matches.length==1&&fin.matches[0],ch=m&&m.sa!=null&&m.sb!=null&&m.sa!=m.sb?(m.sa>m.sb?m.a:m.b):'';
 return d.groups.map((g,gi)=>`<h3>${g.name}</h3><div class="scroll"><table><tr><th>Equipo</th><th>PJ</th><th>Pts</th><th>DG</th></tr>${tbl(g).map(t=>`<tr><td>${esc(t.n)} <small>${esc(t.c)}</small></td><td>${t.pj}</td><td><b>${t.pts}</b></td><td>${t.gd}</td></tr>`).join('')}</table></div>${g.matches.map((m,mi)=>ml(m,`setG(${gi},${mi}`)).join('')}`).join('')
 +d.ko.map((r,ri)=>`<h3>${r.name}</h3>${r.matches.map((m,mi)=>ml(m,`setK(${ri},${mi}`)).join('')}`).join('')+(ch?`<h3>🏆 Campeón: ${esc(ch)}</h3>`:'')}

// ---------- Fixture: gestión (staff) ----------
async function vTorneo(){await load();await loadFP();$('#app').innerHTML=Object.keys(CATS).map(c=>`<div class="card"><h2>${CATS[c]}</h2><div id="c-${c}"></div></div>`).join('')+'<p class="mu">Solo se incluyen alumnos acreditados.</p>';Object.keys(CATS).forEach(rer)}
const rer=c=>{const el=$('#c-'+c);if(el)el.innerHTML=(c=='futbol'?eqUI():'')+`<div class="noprint"><button class="pr" onclick="gen('${c}')">${FX[c]?'Regenerar':'Generar'} fixture con acreditados</button> ${c=='dragster'&&FX[c]?'<button onclick="nextD()">Siguiente ronda</button>':''}${c=='futbol'&&FX[c]?'<button onclick="nextF()">Generar llaves o siguiente fase</button>':''}</div>`+(FX[c]?rc(c,true):'')};
async function save(c){const {error}=await sb.from('fixture').upsert({category:c,data:FX[c],updated_at:new Date().toISOString()});toast(error?error.message:'Guardado ✓',!!error);rer(c)}
const setT=(i,j,v)=>{FX.laberinto.players[i].t[j]=v===''?null:+v;save('laberinto')};
const setP=(r,h,x,v)=>{FX.dragster.rounds[r].heats[h][x].p=v?+v:null;save('dragster')};
const setG=(g,m,k,v)=>{FX.futbol.groups[g].matches[m][k]=v===''?null:+v;save('futbol')};
const setK=(r,m,k,v)=>{FX.futbol.ko[r].matches[m][k]=v===''?null:+v;save('futbol')};
async function gen(cat){if(FX[cat]&&!confirm('Esto borra los resultados actuales. ¿Continuar?'))return;
 const E=(await sb.from('entries').select('partner_dni,students(id,name,dni,club_id,checked_in)').eq('category',cat)).data||[];let d;
 if(cat=='futbol'){const T=FX.futbol_equipos?.teams||[];if(T.length<2)return toast('Armá al menos 2 equipos',1);
  const teams=T.map(t=>({n:t.map(p=>p.n).join(' / ')+(t.length<2?' + ?':''),c:[...new Set(t.map(p=>p.c))].join(' / ')}));
  d={groups:split(shuf(teams),Math.max(1,Math.round(teams.length/4))).map((ts,i)=>({name:'Grupo '+String.fromCharCode(65+i),teams:ts,matches:ts.flatMap((a,x)=>ts.slice(x+1).map(b=>({a:a.n,b:b.n,sa:null,sb:null})))})),ko:[]}}
 else{const L=E.filter(e=>e.students.checked_in).map(e=>({id:e.students.id,n:short(e.students.name),c:cn(e.students.club_id)}));
  if(L.length<2)return toast('Faltan alumnos acreditados',1);
  d=cat=='laberinto'?{players:L.map(p=>({...p,t:[null,null]}))}:{rounds:[{name:L.length<=4?'Final':'Ronda 1',heats:split(shuf(L),Math.ceil(L.length/4)).map(h=>h.map(p=>({...p,p:null})))}]}}
 FX[cat]=d;await save(cat)}
async function nextD(){const d=FX.dragster,r=d.rounds.at(-1);
 if(r.heats.some(h=>h.some(x=>!x.p)))return toast('Faltan cargar posiciones',1);
 if(r.name=='Final')return toast('La final ya está armada');
 const a=r.heats.flatMap(h=>h.filter(x=>x.p<=2)).map(x=>({id:x.id,n:x.n,c:x.c,p:null}));
 d.rounds.push({name:a.length<=4?'Final':'Ronda '+(d.rounds.length+1),heats:split(shuf(a),Math.ceil(a.length/4))});await save('dragster')}
const mk=(q,seed)=>{const ms=[],n=q.length;
 if(seed){const t=q.slice(),bye=n%2?t.shift():null,k=t.length;if(bye)ms.push({a:bye,b:null});for(let i=0;i<k/2;i++)ms.push({a:t[i],b:t[k-1-i],sa:null,sb:null})}
 else for(let i=0;i<n;i+=2)ms.push(q[i+1]?{a:q[i],b:q[i+1],sa:null,sb:null}:{a:q[i],b:null});
 return {name:ms.length==1?'Final':ms.length==2?'Semifinales':ms.length==4?'Cuartos de final':'Eliminatoria',matches:ms}};
async function nextF(){const d=FX.futbol;
 if(!d.ko.length){if(d.groups.some(g=>g.matches.some(m=>m.sa==null||m.sb==null)))return toast('Faltan resultados de la fase de grupos',1);
  const q=d.groups.flatMap(g=>tbl(g).slice(0,d.groups.length>1?2:4).map((t,i)=>({n:t.n,pos:i,pts:t.pts,gd:t.gd}))).sort((a,b)=>a.pos-b.pos||b.pts-a.pts||b.gd-a.gd).map(t=>t.n);
  d.ko.push(mk(q,true))}
 else{const r=d.ko.at(-1);if(r.matches.length==1)return toast('El torneo ya terminó');const w=[];
  for(const m of r.matches){if(m.b==null)w.push(m.a);else{if(m.sa==null||m.sb==null||m.sa==m.sb)return toast('Faltan resultados o hay empate: definí un ganador',1);w.push(m.sa>m.sb?m.a:m.b)}}
  d.ko.push(mk(w,false))}
 await save('futbol')}
// ---------- Fútbol: armado de equipos ----------
let FP=[];
async function loadFP(){const E=(await sb.from('entries').select('partner_dni,students(id,name,dni,club_id,checked_in)').eq('category','futbol')).data||[];FP=E.filter(e=>e.students.checked_in).map(e=>({id:e.students.id,n:short(e.students.name),c:cn(e.students.club_id),dni:e.students.dni,pd:e.partner_dni||''}))}
const teamsF=()=>FX.futbol_equipos?.teams||[];
const pool=()=>{const u=new Set(teamsF().flat().map(p=>p.id));return FP.filter(p=>!u.has(p.id))};
const eqUI=()=>{const T=teamsF(),pl=pool();return `<div class="noprint"><h3>1. Armar equipos</h3><p class="mu">${FP.length} jugadores acreditados · ${T.length} equipos · ${pl.length} sin equipo</p>
<button class="pr" onclick="autoEq()">Armar equipos automáticamente</button>
${pl.length?`<h3>Sin equipo</h3>${pl.map(p=>`<label class="chk"><input type="checkbox" class="pk" value="${p.id}"><span>${esc(p.n)} <small>${esc(p.c)}${p.pd?' · pidió al DNI '+esc(p.pd):''}</small></span></label>`).join('')}<button onclick="joinEq()">Unir seleccionados (1 o 2)</button>`:''}
${T.length?'<h3>Equipos</h3>':''}${T.map((t,i)=>`<div class="ln"><span>${t.map(p=>esc(p.n)).join(' / ')}${t.length<2?' + ?':''} <small>${esc([...new Set(t.map(p=>p.c))].join(' / '))}</small></span><button onclick="delEq(${i})">Deshacer</button></div>`).join('')}<h3>2. Fixture</h3></div>`};
const saveEq=async()=>{await save('futbol_equipos');rer('futbol')};
async function autoEq(){const T=teamsF().slice(),used=new Set(T.flat().map(p=>p.id)),L=FP.filter(p=>!used.has(p.id)),by={};L.forEach(p=>by[p.dni]=p);
 const take=(a,b)=>{used.add(a.id);used.add(b.id);T.push([a,b].map(({id,n,c})=>({id,n,c})))};
 L.forEach(p=>{if(used.has(p.id))return;const q=by[p.pd];if(q&&!used.has(q.id)&&(!q.pd||q.pd==p.dni))take(p,q)});
 const g={},rest=[];shuf(L.filter(p=>!used.has(p.id))).forEach(p=>(g[p.c]=g[p.c]||[]).push(p));
 Object.values(g).forEach(a=>{while(a.length>1)take(a.pop(),a.pop());rest.push(...a)});
 while(rest.length>1)take(rest.pop(),rest.pop());
 FX.futbol_equipos={teams:T};await saveEq()}
async function joinEq(){const ids=[...document.querySelectorAll('.pk:checked')].map(x=>x.value);if(!ids.length||ids.length>2)return toast('Elegí 1 o 2 jugadores',1);
 FX.futbol_equipos={teams:[...teamsF(),ids.map(id=>{const {n,c}=FP.find(x=>x.id==id);return {id,n,c}})]};await saveEq()}
async function delEq(i){const T=teamsF().slice();T.splice(i,1);FX.futbol_equipos={teams:T};await saveEq()}
init();
</script></body></html>
